name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No dependencies and no build step, so the only thing worth matrixing is
        # the Node versions the engines field claims to support. The disk cache
        # needs node:sqlite (>= 22.5) and falls back to NDJSON below it, so the
        # matrix also covers both cache backends.
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          # The generic search is a submodule; without it nothing imports.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
